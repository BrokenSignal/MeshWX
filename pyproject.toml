[project]
name = "meshwx"
version = "1.0.2"
description = "Poll NWS weather alerts and broadcast them over Meshtastic and/or MeshCore radios"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "BrokenSignal" }]
keywords = ["meshtastic", "meshcore", "nws", "weather", "alerts", "emergency", "lora"]

[project.urls]
Homepage = "https://brokensignal.tv/MeshWX/"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
addopts = "-q"

[tool.setuptools]
packages = ["app", "app.web"]
