{% extends "base.html" %}
{% block title %} &middot; NOAA History{% endblock %}
{% block content %}
<h2>Received NOAA Alerts</h2>
<div class="panel">
  <form method="get" action="/history" class="row">
    <div>
      <label>Status</label>
      <select name="disposition">
        <option value="">all</option>
        {% for d in dispositions %}
        <option value="{{ d }}" {% if d == disposition %}selected{% endif %}>{{ disp_label.get(d, d) }}</option>
        {% endfor %}
      </select>
    </div>
    <div><label>From (ISO)</label>
      <input name="date_from" value="{{ date_from }}" placeholder="2026-07-23"></div>
    <div><label>To (ISO)</label>
      <input name="date_to" value="{{ date_to }}" placeholder="2026-07-24"></div>
    <div style="display:flex;align-items:flex-end;">
      <button type="submit">Filter</button></div>
  </form>
</div>
<div class="panel" style="padding:0;" id="history-rows"
     hx-get="/partials/history" hx-trigger="every 15s" hx-swap="innerHTML"
     hx-include="[name='disposition'],[name='date_from'],[name='date_to']">
  {% include "_history_rows.html" %}
</div>
{% endblock %}
