<section class="panel" style="padding:0;">
  <div class="panel-head">
    <h3>IPAWS alerts</h3>
    <a class="see" href="/ipaws">View all &rarr;</a>
  </div>
  {% if ipaws_status %}
  <div class="hint" style="padding:8px 20px;">
    Last poll: {{ (ipaws_status.last_poll_time | localtime(tz)) if ipaws_status.last_poll_time else "-" }}
    &middot; {{ ipaws_status.last_result }} &middot; retransmitted {{ ipaws_status.transmitted }}
  </div>
  {% endif %}
  {% include "_ipaws_rows.html" %}
</section>
