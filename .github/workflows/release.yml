name: Release

# Cut a release by pushing a version tag:  git tag v1.1.0 && git push origin v1.1.0
on:
  push:
    tags: ["v*"]

permissions:
  contents: write   # create the GitHub Release + upload assets
  packages: write   # push the Docker image to GHCR

jobs:
  # ---- multi-arch Docker image -> GitHub Container Registry ----
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # ---- Windows standalone bundle (PyInstaller onedir) -> Release asset ----
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps + PyInstaller
        run: |
          pip install -r requirements.txt
          pip install pyinstaller==6.11.1
      - name: Build
        run: pyinstaller packaging/meshwx.spec
      - name: Zip bundle
        run: Compress-Archive -Path dist/MeshWX/* -DestinationPath MeshWX-windows-${{ github.ref_name }}.zip
      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: MeshWX-windows-${{ github.ref_name }}.zip
          generate_release_notes: true
          # A tag with a hyphen (e.g. v1.0.3-rc1) is a prerelease: keep it out of
          # "Latest" so test builds never supersede a real release.
          prerelease: ${{ contains(github.ref_name, '-') }}
